<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/TeamSESH_Logo.jpg" type="image/png">
<title>DeadBoy</title>
</head>
<body class="intro-active">
    <main class="home-intro" aria-label="Tela inicial">
        <button class="home-intro__button" type="button" aria-label="Entrar no site SESH">
            <H1>TEAM SESH DEADBOYS</H1>
            <img src="img/TeamSESH_Logo.jpg" alt="SESH" class="home-intro__logo">
            <p>Powered by Emifita</p>
        </button>
    </main>
    <header class="header">
        <h1 class="sesh-name">SESH<br>MUSIC</h1>
        <img src="img/skealeton-sesh.jpg" alt="sesh logo" class="sesh-image">
        <nav class="navbar">
            <a href="#" class="home nav-element" id="home-button">HOME</a>
            <a href="#" class="album nav-element">PESQUISAR</a>
            <div class="history-menu">
                <button class="history-title" type="button">
                HISTÓRICO
                </button>
            <ul class="history-list"></ul>
</div>
        </nav>
    </header>
    <div class="watch">
        <p class="timer"></p>
    </div>
    <form class="container box-default">
        <label for="musicInput">Nome da musica:</label>
        <input type="text" id="musicInput" placeholder="Digite a musica...">
        <button id="searchButton" type="submit">SESH</button>
        <div id="player" class="box-default"></div>
        <ul id="musicList"></ul>
    </form>
    <footer class="footer"><div class="box-default"><p>Powered By Emifita ©</p></div></footer>
    <script src="./assets/js/bundle.js" type="module"></script>
</body>
</html>
